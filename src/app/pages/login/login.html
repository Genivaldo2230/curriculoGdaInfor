<div class="login-container">
  <h2>Login</h2>

  <label for="email">Email</label>
  <input id="email" type="email" placeholder="Digite seu email" [(ngModel)]="usuario" />

  <label for="senha">Senha</label>
  <input id="senha" type="password" placeholder="Digite sua senha" [(ngModel)]="senha" />

  <button (click)="login()">Entrar</button>
</div>
